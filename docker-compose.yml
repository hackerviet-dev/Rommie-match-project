name: roomiematch

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomiematch}
      POSTGRES_USER: ${POSTGRES_USER:-roomiematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomiematch_dev}
    ports:
      # Host port is 55432 to stay clear of a stock PostgreSQL already on 5432.
      # The container-side port stays 5432, so the api keeps using postgres:5432.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-roomiematch}
      PGUSER: ${POSTGRES_USER:-roomiematch}
      PGPASSWORD: ${POSTGRES_PASSWORD:-roomiematch_dev}
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint: ["sh", "/migrations/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/src/RoomieMatch.Bootstrapper/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-roomiematch};Username=${POSTGRES_USER:-roomiematch};Password=${POSTGRES_PASSWORD:-roomiematch_dev}
      Jwt__Secret: ${JWT_SECRET:-roomiematch-local-dev-secret-change-me-in-production}
      # No payment provider by default. Set BILLING_PROVIDER=mock only for local tests.
      Billing__Provider: ${BILLING_PROVIDER:-}
      Billing__PublicApiBaseUrl: ${BILLING_PUBLIC_API_URL:-http://localhost:5000}
      Billing__ReturnUrl: ${BILLING_RETURN_URL:-http://localhost:3100/premium/result}
      # payOS merchant credentials. Left empty on purpose: put the real values in .env, never in
      # the repo. They only matter while Billing__Provider is payos.
      Billing__PayOs__ClientId: ${PAYOS_CLIENT_ID:-}
      Billing__PayOs__ApiKey: ${PAYOS_API_KEY:-}
      Billing__PayOs__ChecksumKey: ${PAYOS_CHECKSUM_KEY:-}
      # Browsers only; the web container proxies /api, so it is same-origin and needs no entry.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
      # Leave false while port ${API_PORT:-5000} below is published: a direct caller could
      # forge X-Forwarded-For to dodge per-IP rate limits. Set true in a deployment where
      # the API is reachable only through the proxy.
      ReverseProxy__TrustForwardedHeaders: ${API_TRUST_FORWARDED_HEADERS:-false}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: frontend/web-app/rommie-match
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 3100 on the host: 3000 is commonly taken by another local stack.
      - "${WEB_PORT:-3100}:80"
    depends_on:
      - api

volumes:
  postgres_data:
