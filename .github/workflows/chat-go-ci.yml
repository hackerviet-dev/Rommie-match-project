name: Chat Go CI

on:
  workflow_dispatch:
  push:
    branches: [main, Bao-Branch]
    paths:
      - "backend/chat-service/**"
      - ".github/workflows/chat-go-ci.yml"
  pull_request:
    paths:
      - "backend/chat-service/**"
      - ".github/workflows/chat-go-ci.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/chat-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/chat-service/go.mod
          cache-dependency-path: backend/chat-service/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...
