name: Backend .NET CI

on:
  workflow_dispatch:
  push:
    branches: [main, Bao-Branch]
    paths:
      - "backend/src/**"
      - ".github/workflows/backend-dotnet-ci.yml"
  pull_request:
    paths:
      - "backend/src/**"
      - ".github/workflows/backend-dotnet-ci.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/src/RoomieMatch.slnx

      - name: Build
        run: dotnet build backend/src/RoomieMatch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/src/RoomieMatch.slnx --configuration Release --no-build
